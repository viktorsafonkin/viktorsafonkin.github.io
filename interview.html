      <figure class="gilliam">
        <blockquote lang="en">“Far too much modern art is intellectually vague, emotionally sterile, abstract and conceptual.. and successful only in failing to deal with the fears, joys, and anguish of our lives. In contrast, Victor Safonkin's art confronts the human condition head on with powerful mythic images all sumptuously rendered in an unapologetic classical style that reaches back into an ancient past to rub shoulders with the likes of Brueghel and Bosch.”</blockquote>
        <p class="gilliam-ru">«Слишком много современного искусства интеллектуально расплывчато, эмоционально стерильно, абстрактно и концептуально… и преуспевает лишь в том, что не способно говорить о страхах, радостях и муках нашей жизни. Искусство Виктора Сафонкина, напротив, смотрит в лицо человеческому существованию — мощными мифическими образами, роскошно написанными в бескомпромиссном классическом стиле, который уходит в глубокое прошлое и встаёт в один ряд с Брейгелем и Босхом».</p>
        <figcaption>— Терри Гиллиам, режиссёр</figcaption>
