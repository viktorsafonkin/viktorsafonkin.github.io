      <figure class="gilliam">
        <blockquote lang="en">“Far too much modern art is intellectually vague, emotionally sterile, abstract and conceptual.. and successful only in failing to deal with the fears, joys, and anguish of our lives. In contrast, Victor Safonkin's art confronts the human condition head on with powerful mythic images all sumptuously rendered in an unapologetic classical style that reaches back into an ancient past to rub shoulders with the likes of Brueghel and Bosch.”</blockquote>
        <figcaption>— <a class="person" href="https://en.wikipedia.org/wiki/Terry_Gilliam" target="_blank" rel="noopener" title="映画監督、モンティ・パイソンのメンバー" data-tip="映画監督、モンティ・パイソンのメンバー">テリー・ギリアム</a>、映画監督</figcaption>
