  <figure class="lb-fig">
    <img id="lbImg" src="" alt="">
    <figcaption><span id="lbTitle"></span><span id="lbCount"></span></figcaption>
  </figure>
  <button class="lb-nav lb-next" id="lbNext" aria-label="次へ">→</button>
</div>
<script>(function(){var L=[].slice.call(document.querySelectorAll(".gal-i")),lb=document.getElementById("lb"),im=document.getElementById("lbImg"),c=document.getElementById("lbCount"),k=0;
function show(i){k=(i+L.length)%L.length;im.src=L[k].getAttribute("href");im.alt=L[k].querySelector("img").alt;c.textContent=(k+1)+" / "+L.length;}
function close(){lb.hidden=true;im.src="";document.body.style.overflow="";}
L.forEach(function(a,i){a.addEventListener("click",function(e){e.preventDefault();show(i);lb.hidden=false;document.body.style.overflow="hidden";});});
document.getElementById("lbClose").onclick=close;document.getElementById("lbPrev").onclick=function(){show(k-1)};document.getElementById("lbNext").onclick=function(){show(k+1)};
lb.addEventListener("click",function(e){if(e.target===lb)close();});
document.addEventListener("keydown",function(e){if(lb.hidden)return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")show(k-1);if(e.key==="ArrowRight")show(k+1);});})();</script>
